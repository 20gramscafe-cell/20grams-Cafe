name: Bootstrap 20grams Cafe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned original
        run: |
          git clone https://github.com/aandscafebenisuef-prog/AS-Cafe.git /tmp/original
          cd /tmp/original
          git checkout e470780c3daa01d59221747291fc7e9e46f047b7
      - name: Copy and rebrand
        run: |
          rm -rf ./*
          find /tmp/original -mindepth 1 -maxdepth 1 ! -name .git -exec cp -a {} . \;
          python3 - <<'PY'
          from pathlib import Path
          import re
          for fn in ['index.html','admin.html','app.js','admin.js','admin-realtime.js','refresh-warning.js','styles.css','admin.css']:
            p=Path(fn)
            if not p.exists(): continue
            s=p.read_text()
            for a in ['M&H CAFÉ','M&H Café','M&H']:
              s=s.replace(a,'20grams Cafe')
            if fn=='app.js':
              s=re.sub(r'const SUPABASE_URL="[^"]+"','const SUPABASE_URL="https://qnkddysjbiauplefuxaq.supabase.co"',s,1)
              s=re.sub(r'const SUPABASE_KEY="[^"]*"','const SUPABASE_KEY=""',s,1)
              s=s.replace('const headers={apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"};','const headers={"Content-Type":"application/json"};')
              s=s.replace('headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"}','headers:{"Content-Type":"application/json"}')
              s=s.replace('const tr=await db.from("cafe_tables").select("id,table_number,active").eq("table_number",state.table.table_number).eq("active",true).maybeSingle();','const tr={data:state.table,error:null};')
            if fn=='admin.js':
              s=s.replace('https://hxkhhnrorjxrrqxevvcr.supabase.co','https://qnkddysjbiauplefuxaq.supabase.co')
              s=s.replace('const ADMIN_TOKEN=(location.hash||"").replace(/^#/,"")||"20grams";','const ADMIN_TOKEN="20grams";')
              s=s.replace('const match=source.match(/(?:const|let|var)\\s+SUPABASE_KEY\\s*=\\s*["\']([^"\']+)["\']/);','const match=null;')
              s=s.replace('if(!match)throw new Error("تعذر العثور على مفتاح الاتصال.");\n  return match[1];','return "";')
              s=s.replace('headers:{"apikey":apiKey,"Content-Type":"application/json"}','headers:{"Content-Type":"application/json"}')
            p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          for fn in ['index.html','admin.html']:
            p=Path(fn); s=p.read_text()
            if 'Designed &amp; Developed by' not in s:
              footer='<footer class="developer-footer"><div>Designed &amp; Developed by</div><strong>Mohamed Abdelkareem</strong><div>© 2026 · <a href="tel:01034469004">01034469004</a></div></footer>'
              s=s.replace('</body>',footer+'\n</body>')
            p.write_text(s)
          Path('styles.css').write_text(Path('styles.css').read_text()+'\n.developer-footer{text-align:center;padding:18px 12px;margin-top:32px;color:var(--muted);font-size:12px;line-height:1.7}.developer-footer strong{display:block;color:var(--text);font-size:13px}.developer-footer a{color:inherit}\n')
          Path('admin.css').write_text(Path('admin.css').read_text()+'\n.developer-footer{text-align:center;padding:16px 12px;color:var(--muted);font-size:12px;line-height:1.7}.developer-footer strong{display:block;color:var(--text);font-size:13px}.developer-footer a{color:inherit}\n')
          PY
      - name: Pages workflow
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/pages.yml <<'YAML'
          name: Deploy 20grams Cafe
          on:
            push:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
            pages: write
            id-token: write
          concurrency:
            group: pages
            cancel-in-progress: true
          jobs:
            deploy:
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/configure-pages@v5
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: .
                - id: deployment
                  uses: actions/deploy-pages@v4
          YAML
      - name: Commit generated app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Build 20grams Cafe from pinned AS-Cafe source' || exit 0
          git push origin HEAD:main
